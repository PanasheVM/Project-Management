spring:
  application:
    name: stageflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stageflow}
    username: ${DATABASE_USER:stageflow}
    password: ${DATABASE_PASSWORD:stageflow-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/stageflow}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
server:
  shutdown: graceful
springdoc:
  swagger-ui:
    path: /swagger-ui.html
