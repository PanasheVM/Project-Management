name: StageFlow
options:
  bundleIdPrefix: app.stageflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  StageFlow:
    type: application
    platform: iOS
    sources: [StageFlow]
    info:
      path: StageFlow/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.stageflow.ios
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [StageFlowTests]
  StageFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StageFlowTests]
    dependencies:
      - target: StageFlow
